name: miejscowki_map
description: Interfejs mapy miejscówek inspirowany dostarczonym zrzutem ekranu.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.1
  http: ^1.6.0
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21