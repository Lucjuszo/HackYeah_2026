# Flutter web (static files) behind the Cloudflare tunnel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Minimal logs: no access log; warnings and errors in the logs volume (deploy/docker-compose.yml).
    access_log off;
    error_log /logs/nginx/error.log warn;

    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Flutter web file names have no content hash (main.dart.js, flutter_bootstrap.js...):
    # always revalidate, so a new deploy reaches phones at once. ETag keeps unchanged files at 304.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
