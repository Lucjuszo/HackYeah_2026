# Flutter web (static files) behind the Cloudflare tunnel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Minimal logs: no access log; warnings and errors in the logs volume (deploy/docker-compose.yml).
    access_log off;
    error_log /logs/nginx/error.log warn;

    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Flutter web file names have no content hash (main.dart.js, flutter_bootstrap.js...):
    # always revalidate, so a new deploy reaches phones at once. ETag keeps unchanged files at 304.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hidden health check (not linked anywhere): frontend -> API -> database as JSON, from the backend's
    # GET /health/details; 200 = all ok, 503 = something is down.
    location = /_fm/s7k2q-hc {
        # Resolved per request through Docker's DNS: nginx still starts while the backend is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend/health/details;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # Answered by nginx itself when the API can't be reached.
        error_page 502 504 = @api_unreachable;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location @api_unreachable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"down","api":{"status":"unreachable"},"database":{"status":"unknown"}}';
    }
}
